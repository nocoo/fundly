name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (e.g. v0.1.1)"
        required: true
        type: string

jobs:
  deploy-tagged:
    name: Deploy Worker (tagged)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Resolve version
        id: ver
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          PKG_VERSION=$(jq -r .version package.json)
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "Tag $TAG does not match package.json $PKG_VERSION" >&2
            exit 1
          fi
      - name: Require deploy secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          missing=0
          require() {
            local var="$1"
            if [ -z "${!var}" ]; then
              echo "Missing GitHub Actions secret: $var" >&2
              missing=1
            fi
          }
          require CLOUDFLARE_API_TOKEN
          require CLOUDFLARE_ACCOUNT_ID
          require CF_ACCESS_CLIENT_ID
          require CF_ACCESS_CLIENT_SECRET
          if [ "$missing" -ne 0 ]; then
            echo "Configure repo secrets on nocoo/fundly, then re-run Release." >&2
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install
        run: |
          bun install --frozen-lockfile
          bun install --cwd apps/web --frozen-lockfile
          bun install --cwd apps/worker --frozen-lockfile
      - name: Build web
        run: bun run build:web
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply fundly-db --remote
          workingDirectory: apps/worker
          packageManager: bun
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: apps/worker
          packageManager: bun
      - name: Verify /api/live
        env:
          ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          EXPECT_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${ACCESS_CLIENT_ID}" ] || [ -z "${ACCESS_CLIENT_SECRET}" ]; then
            echo "CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET are required" >&2
            exit 1
          fi
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -sS -o /tmp/fundly-live.json -w '%{http_code}' \
              -H "CF-Access-Client-Id: ${ACCESS_CLIENT_ID}" \
              -H "CF-Access-Client-Secret: ${ACCESS_CLIENT_SECRET}" \
              https://fundly.hexly.ai/api/live || true)
            echo "attempt $i: http ${CODE} $(cat /tmp/fundly-live.json)"
            if [ "${CODE}" = "200" ] && jq -e --arg v "${EXPECT_VERSION}" \
              '.status == "ok" and .version == $v' /tmp/fundly-live.json >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1
