name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: Lint test typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install
        run: |
          bun install --frozen-lockfile
          bun install --cwd apps/web --frozen-lockfile
          bun install --cwd apps/worker --frozen-lockfile
      - name: Typecheck
        run: |
          bun run typecheck
          bun run typecheck:scripts
          bun run typecheck:web
      - name: Lint
        run: bun run lint
      - name: Test
        run: |
          bun run test
          bun run test:web
