name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (e.g. v0.1.1)"
        required: true
        type: string

jobs:
  deploy-tagged:
    name: Deploy Worker (tagged)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Resolve version
        id: ver
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          PKG_VERSION=$(jq -r .version package.json)
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "Tag $TAG does not match package.json $PKG_VERSION" >&2
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install
        run: |
          bun install --frozen-lockfile
          bun install --cwd apps/web --frozen-lockfile
          bun install --cwd apps/worker --frozen-lockfile
      - name: Build web
        run: bun run build:web
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply fundly-db --remote
          workingDirectory: apps/worker
          packageManager: bun
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: apps/worker
          packageManager: bun
      - name: Verify /api/live
        run: |
          set -e
          for i in 1 2 3 4 5 6; do
            BODY=$(curl -fsS https://fundly.hexly.ai/api/live || true)
            echo "attempt $i: $BODY"
            echo "$BODY" | jq -e '.status == "ok"' && exit 0
            echo "$BODY" | grep -q '302 Found' && echo "Access login (edge up)" && exit 0
            sleep 5
          done
          exit 1
