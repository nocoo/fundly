# CI slot standard v1 (nocoo/base-ci docs/slots.md): impl S1, S2, S3, G1, G2, B1, L1, L2, Z1 via quality.yml;
# na L1.5, P1; todo L3 in slot-status. nocoo/base-ci v2026.12: top-level slot jobs, L2 command inlined.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
    with:
      package-manager: bun
      runtime-version: "1.4.4"
      node-version: "26.12.1"
      install-policy: project
      extra-install-dirs: apps/web,apps/worker
      typecheck-command: bun run typecheck && bun run typecheck:scripts && bun run typecheck:web
      lint-command: bun run lint
      test-command: bun run test:coverage
      coverage-path: coverage
      build: true
      build-command: bun run build:web
      gitleaks-config: .gitleaks.toml
      lockfiles: bun.lock,apps/web/bun.lock,apps/worker/bun.lock
      workflow-lint: true
      workflow-lint-yamllint: true
      workflow-lint-required-workflow: nocoo/base-ci/.github/workflows/deploy-docker.yml
      l2: true
      l2-command: bun test apps/worker/scripts/market-api.test.ts apps/worker/scripts/selection-api.test.ts apps/worker/scripts/daily-api.test.ts apps/worker/scripts/read-api.test.ts
      slot-status: >-
        {"S1": {"status": "impl"},
        "S2": {"status": "impl"},
        "S3": {"status": "impl"},
        "G1": {"status": "impl"},
        "G2": {"status": "impl"},
        "B1": {"status": "impl"},
        "L1": {"status": "impl"},
        "L1.5": {"status": "na", "reason": "生产为 jp4 Docker 上的 Bun/Hono，无 Cloudflare Workers 运行时测试套件"},
        "L2": {"status": "impl"},
        "L3": {"status": "todo", "reason": "有 Vite/React 浏览器界面，但 CI 尚未接入 Playwright 或 navigation.browser E2E"},
        "P1": {"status": "na", "reason": "根目录与 apps/* 的 package.json 均为 private，不发布 npm 包"},
        "Z1": {"status": "impl"}}
