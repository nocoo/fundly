name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      ci-run-id:
        description: Successful main push CI run ID for the exact tested commit
        required: true
        type: string

jobs:
  deploy:
    if: |
      github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    uses: nocoo/base-ci/.github/workflows/deploy-docker.yml@af9a2b3f82c367d6eb6def5c3583ac717e0868ad # main 2026-10-26
    with:
      tailscale: true
      environment: fundly / production
      source-run-id: ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.id) || inputs.ci-run-id }}
      images: '[{"image":"ghcr.io/nocoo/fundly","service":"web"}]'
      deploy-directory: /data/fundly
      remote-verify-command: |
        python3 - <<'PY'
        import json, os, re, subprocess, time, urllib.error, urllib.request

        source = os.environ['IMAGE_SHA']
        releases = json.loads(os.environ['RELEASE_IMAGES'])
        if not re.fullmatch(r'[a-f0-9]{40}', source) or len(releases) != 1:
            raise SystemExit('Invalid Fundly release manifest')
        release = releases[0]
        if (release.get('service') != 'web' or release.get('image') != 'ghcr.io/nocoo/fundly'
                or release.get('sourceSha') != source
                or not re.fullmatch(r'sha256:[a-f0-9]{64}', release.get('digest', ''))):
            raise SystemExit('Release manifest does not identify the expected Fundly image')

        reference = release['image'] + '@' + release['digest']
        image = json.loads(subprocess.check_output(['docker', 'image', 'inspect', reference], text=True))[0]
        container = json.loads(subprocess.check_output(['docker', 'inspect', 'fundly-app'], text=True))[0]
        mounts = container.get('Mounts') or []
        data_mount = next((m for m in mounts if m.get('Destination') == '/data' and m.get('Type') == 'bind'), None)
        if not data_mount or data_mount.get('Source') != '/data/fundly/data':
            raise SystemExit('Fundly data volume is not bind-mounted from /data/fundly/data')
        if (container['Config']['Image'] != reference or container['Image'] != image['Id']
                or reference not in image.get('RepoDigests', [])
                or image.get('Config', {}).get('Labels', {}).get('org.opencontainers.image.revision') != source):
            raise SystemExit('Running container does not match the verified image digest and source revision')
        version = subprocess.check_output(
            ['docker', 'exec', 'fundly-app', 'bun', '-e',
             "console.log(JSON.parse(await Bun.file('/app/package.json').text()).version)"],
            text=True).strip()
        if not re.fullmatch(r'\d+\.\d+\.\d+', version):
            raise SystemExit('Running image package version is invalid')

        class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, req, fp, code, msg, headers, newurl):
                return None

        opener = urllib.request.build_opener(NoRedirect())

        def request(path, method='GET', body=None):
            headers = {
                'Host': 'fundly.hexly.ai',
                'X-Forwarded-Proto': 'https',
            }
            if body is not None:
                headers['Content-Type'] = 'application/json'
            req = urllib.request.Request('http://127.0.0.1:17040' + path, data=body, headers=headers, method=method)
            try:
                response = opener.open(req, timeout=15)
                return response.status, response.headers, response.read()
            except urllib.error.HTTPError as error:
                return error.code, error.headers, error.read()

        live = None
        for attempt in range(10):
            try:
                status, headers, payload = request('/api/live')
                if status == 200 and headers.get('Cache-Control') == 'no-store':
                    candidate = json.loads(payload)
                    if (candidate.get('status') == 'ok' and candidate.get('version') == version
                            and candidate.get('database') == {'connected': True}):
                        live = candidate
                        break
            except Exception:
                pass
            if attempt < 9:
                time.sleep(3)
        if not live:
            raise SystemExit('Private /api/live did not confirm image version and database health')

        status, headers, body = request('/')
        if status != 200 or 'text/html' not in headers.get('Content-Type', '') or not body:
            raise SystemExit('Private read-only homepage check failed')
        me_status, _, me_body = request('/api/me')
        if me_status != 200:
            raise SystemExit('Private unauthenticated /api/me status check failed')
        try:
            me = json.loads(me_body)
        except json.JSONDecodeError:
            raise SystemExit('Private unauthenticated /api/me body is not JSON')
        if me.get('authenticated') is not False or me.get('authRequired') is not True:
            raise SystemExit('Private unauthenticated /api/me contract check failed')
        print(f"Private Fundly acceptance passed: revision {source}, {release['digest']}, version {live['version']}")
        PY
      verify-command: |
        node --input-type=module <<'JS'
        import { verifyDeployment } from './scripts/verify-deployment.mjs';
        try {
          console.log(await verifyDeployment({
            phase: ${{ toJSON(vars.DEPLOY_PHASE) }},
            target: ${{ toJSON(vars.DEPLOY_URL) }},
            originMarker: ${{ toJSON(vars.DEPLOY_ORIGIN_MARKER) }},
            sourceSha: process.env.SOURCE_SHA,
            imageManifest: process.env.RELEASE_IMAGES,
          }));
        } catch (error) {
          console.error(`Deployment verification failed: ${error.message}`);
          process.exitCode = 1;
        }
        JS
      timeout-minutes: 25
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}

permissions:
  contents: read
  actions: read
  packages: write
  id-token: write
